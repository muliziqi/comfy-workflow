# CI 只跑 Windows 单腿:交付物是 .bat + Git Bash 脚本 + 纯标准库 Python,
# ubuntu 腿对 .bat 无法提供有效覆盖,故不设。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover tests -v
